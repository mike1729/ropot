services:
  default:
    image: python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
    init: true
    command: ["sleep", "infinity"]
    user: "65534:65534"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 32
    working_dir: /work
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,mode=1777
